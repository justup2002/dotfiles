"$schema" = 'https://starship.rs/config-schema.json'


format = """
[╭](fg:current_line)\
$os\
$directory\
$git_branch\
$fill\
$nodejs\
$dotnet\ 
$python\
$java\
$c\
$cmd_duration\
$shell\
$time\
$username\
$line_break\
$character\
"""

palette = 'one_dark_pro'
add_newline = true

[profiles]
claude-code = """
${custom.claude_model_effort}\
${custom.claude_context_usage}\
${custom.claude_session_stats}\
${custom.claude_five_hour_limit}\
${custom.claude_seven_day_limit}\
${custom.claude_fable_limit}\
"""

[palettes.one_dark_pro]
foreground = '#abb2bf'
background = '#282c34'
current_line = '#5c6370'
primary = '#3e4451'
box = '#5c6370'
blue	= '#61afef'
cyan = '#56b6c2'
green	= '#98c379'
orange = '#d19a66'
pink = '#c162de'
purple = '#c678dd'
red	= '#e06c75'
yellow = '#e5c07b'

[os]
format = '(fg:current_line)[](fg:red)[$symbol ](fg:primary bg:red)[](fg:red)'
disabled = false

[os.symbols]
Alpine = ''
Amazon = ''
Android = ''
Arch = ''
CentOS = ''
Debian = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Linux = ''
Macos = ''
Manjaro = ''
Mariner = ''
Mint = ''
NetBSD = ''
NixOS = ''
OpenBSD = ''
OpenCloudOS = ''
openEuler = ''
openSUSE = ''
OracleLinux = '⊂⊃'
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Windows = ''

[directory]
format = '[─](fg:current_line)[](fg:pink)[󰷏 ](fg:primary bg:pink)[](fg:pink bg:box)[ $read_only$truncation_symbol$path](fg:foreground bg:box)[](fg:box)'
home_symbol = " ~/"
truncation_symbol = ' '
truncation_length = 2
read_only = '󱧵 '
read_only_style = ''

[git_branch]
format = '[─](fg:current_line)[](fg:green)[$symbol](fg:primary bg:green)[](fg:green bg:box)[ $branch](fg:foreground bg:box)[](fg:box)'
symbol = ' '

[nodejs]
format = '[─](fg:current_line)[](fg:green)[$symbol](fg:primary bg:green)[](fg:green bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
symbol = '󰎙 Node.js'

[dotnet]
format = '[─](fg:current_line)[](fg:purple)[$symbol](fg:primary bg:purple)[](fg:purple bg:box)[ $tfm](fg:foreground bg:box)[](fg:box)'
symbol = ' .NET'

[python]
format = '[─](fg:current_line)[](fg:green)[$symbol](fg:primary bg:green)[](fg:green bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
symbol = ' python'

[java]
format = '[─](fg:current_line)[](fg:red)[$symbol](fg:primary bg:red)[](fg:red bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
symbol = ' Java'

[c]
format = '[─](fg:current_line)[](fg:blue)[$symbol](fg:primary bg:blue)[](fg:blue bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
symbol = ' C'

[custom.claude_model_effort]
command = 'printf "%s" "$CLAUDE_CODE_MODEL_EFFORT"'
when = 'test -n "$CLAUDE_CODE_MODEL_EFFORT"'
format = '[](fg:purple)[󰚩 ](fg:primary bg:purple)[](fg:purple bg:box)[ $output](fg:foreground bg:box)[](fg:box) '

[custom.claude_context_usage]
command = 'printf "%s" "$CLAUDE_CODE_CONTEXT_USAGE"'
when = 'test -n "$CLAUDE_CODE_CONTEXT_USAGE"'
format = '[](fg:cyan)[󰍛 ](fg:primary bg:cyan)[](fg:cyan bg:box)[ $output](fg:foreground bg:box)[](fg:box) '

[custom.claude_session_stats]
command = 'printf "%s" "$CLAUDE_CODE_SESSION_STATS"'
when = 'test -n "$CLAUDE_CODE_SESSION_STATS"'
format = '[](fg:green)[󰓡 ](fg:primary bg:green)[](fg:green bg:box)[ $output](fg:foreground bg:box)[](fg:box) '

[custom.claude_five_hour_limit]
command = 'printf "%s" "$CLAUDE_CODE_FIVE_HOUR_LIMIT"'
when = 'test -n "$CLAUDE_CODE_FIVE_HOUR_LIMIT"'
format = '[](fg:yellow)[󱎫 ](fg:primary bg:yellow)[](fg:yellow bg:box)[ $output](fg:foreground bg:box)[](fg:box) '

[custom.claude_seven_day_limit]
command = 'printf "%s" "$CLAUDE_CODE_SEVEN_DAY_LIMIT"'
when = 'test -n "$CLAUDE_CODE_SEVEN_DAY_LIMIT"'
format = '[](fg:orange)[󰸘 ](fg:primary bg:orange)[](fg:orange bg:box)[ $output](fg:foreground bg:box)[](fg:box)'

# Fable weekly bucket — only set when Fable or Mythos is the active model. Leading
# space (instead of a trailing one on claude_seven_day_limit) so the line
# ends cleanly when this segment is hidden.
[custom.claude_fable_limit]
command = 'printf "%s" "$CLAUDE_CODE_FABLE_LIMIT"'
when = 'test -n "$CLAUDE_CODE_FABLE_LIMIT"'
format = ' [](fg:pink)[󰓎 ](fg:primary bg:pink)[](fg:pink bg:box)[ $output](fg:foreground bg:box)[](fg:box)'

[fill]
symbol = '─'
style = 'fg:current_line'

[cmd_duration]
min_time = 500
format = '[─](fg:current_line)[](fg:orange)[ ](fg:primary bg:orange)[](fg:orange bg:box)[ $duration ](fg:foreground bg:box)[](fg:box)'

[shell]
format = '[─](fg:current_line)[](fg:blue)[ ](fg:primary bg:blue)[](fg:blue bg:box)[ $indicator](fg:foreground bg:box)[](fg:box)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

[time]
format = '[─](fg:current_line)[](fg:purple)[󰦖 ](fg:primary bg:purple)[](fg:purple bg:box)[ $time](fg:foreground bg:box)[](fg:box)'
time_format = '%H:%M'
disabled = false

[username]
format = '[─](fg:current_line)[](fg:yellow)[ ](fg:primary bg:yellow)[](fg:yellow bg:box)[ $user](fg:foreground bg:box)[](fg:box) '
show_always = true

[character]
format = """
[╰─$symbol](fg:current_line) """
success_symbol = '[❯](bold fg:cyan)'
error_symbol   = '[❯](bold fg:red)'
vimcmd_symbol  = '[❮](bold fg:purple)'
